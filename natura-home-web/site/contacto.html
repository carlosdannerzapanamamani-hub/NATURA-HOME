<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contacta a Natura &amp; Home por WhatsApp. Bella Vista, El Alto, Bolivia.">
  <meta name="theme-color" content="#24421f">
  <title>Contacto | Natura &amp; Home</title>
  <link rel="icon" href="assets/icons/favicon.png">

  <!-- Estilos: de lo general a lo particular (el orden importa) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/animaciones.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- El anuncio, el encabezado con el menú y el pie de página los dibuja js/estructura.js
       (así el menú se cambia en un solo lugar y se ve igual en todas las páginas). -->

  <main>
    <!-- Título de la página -->
    <header class="phead">
      <div class="wrap">
        <h1 data-in>Estamos para ayudarte</h1>
        <p data-in style="--d:1">Haz tu pedido o consulta directamente con Natura &amp; Home.</p>
      </div>
    </header>

    <!-- Datos de contacto y formulario -->
    <section class="sec">
      <div class="wrap grid g2 split-top">
        <aside>
          <dl class="dl">
            <div><dt>Dirección</dt><dd data-s="address"></dd></div>
            <div><dt>Horario</dt><dd data-s="hours"></dd></div>
            <div><dt>WhatsApp</dt><dd>Respuesta directa para pedidos y consultas.</dd></div>
          </dl>
          <a class="btn acts-spaced" data-wa="Hola Natura &amp; Home, quisiera información sobre sus plantas.">Escribir por WhatsApp</a>
        </aside>
        <form class="card" id="contactForm">
          <h2 class="form-title">Envíanos un mensaje</h2>
          <div class="field"><label for="n">Tu nombre</label><input id="n" name="n" required autocomplete="name"></div>
          <div class="field"><label for="m">Mensaje</label><textarea id="m" name="m" rows="5" required placeholder="Cuéntanos qué planta buscas"></textarea></div>
          <button class="btn btn-block" type="submit">Enviar por WhatsApp</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Scripts: cada uno usa al anterior (el orden importa) -->
  <script src="js/datos.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/estructura.js"></script>
  <script src="js/animaciones.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/comprobante.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/paginas.js"></script>
  <script src="js/principal.js"></script>
</body>
</html>
